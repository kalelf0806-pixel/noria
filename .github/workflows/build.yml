name: Build Noria APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Clean and regenerate Android structure
      run: |
        rm -rf android
        flutter create --platforms=android --org app.noria .
        rm -f android/build.gradle.kts android/app/build.gradle.kts

    - name: Configure Root Gradle (Groovy DSL & SDK 36 Override)
      run: |
        cat << 'GRADLE' > android/build.gradle
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }

        rootProject.buildDir = "../build"
        subprojects {
            project.buildDir = "${rootProject.buildDir}/${project.name}"
        }
        subprojects {
            project.evaluationDependsOn(":app")
        }

        subprojects {
            plugins.withId('com.android.library') {
                android {
                    compileSdk 36
                }
            }
            plugins.withId('com.android.application') {
                android {
                    compileSdk 36
                }
            }
        }

        tasks.register("clean", Delete) {
            delete rootProject.buildDir
        }
        GRADLE

    - name: Configure App Gradle (Android 15 / targetSdk 35)
      run: |
        cat << 'GRADLE' > android/app/build.gradle
        plugins {
            id "com.android.application"
            id "kotlin-android"
            id "dev.flutter.flutter-gradle-plugin"
        }

        android {
            namespace "app.noria"
            compileSdk 36

            defaultConfig {
                applicationId "app.noria"
                minSdk 24
                targetSdk 35
                versionCode 1
                versionName "1.0.0"
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }

            kotlinOptions {
                jvmTarget = "17"
            }

            buildTypes {
                release {
                    signingConfig signingConfigs.debug
                    minifyEnabled false
                    shrinkResources false
                }
            }
        }

        flutter {
            source "../.."
        }
        GRADLE

    - name: Install dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: noria-release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
